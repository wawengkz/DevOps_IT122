name: BrainBytes Build

on:
  push:
    branches: [ main, development ]
  paths-ignore:
    - '**.md'
    - 'docs/**'
  workflow_dispatch:  # Allows manual triggering

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Debug - Check file structure
        run: |
          echo "=== Repository Structure ==="
          ls -la
          echo ""
          echo "=== Frontend Directory ==="
          ls -la frontend/ || echo "Frontend directory not found"
          echo ""
          echo "=== Backend Directory ==="
          ls -la backend/ || echo "Backend directory not found"
          echo ""
          echo "=== Dockerfile Check ==="
          echo "Frontend Dockerfile:"
          cat frontend/Dockerfile || echo "Frontend Dockerfile not found"
          echo ""
          echo "Backend Dockerfile:"
          cat backend/Dockerfile || echo "Backend Dockerfile not found"
        
      - name: Build frontend image
        run: |
          echo "Building frontend image..."
          docker buildx build \
            --tag brainbytes/frontend:latest \
            --cache-from type=gha,scope=frontend \
            --cache-to type=gha,mode=max,scope=frontend \
            --load \
            ./frontend
            
      - name: Build backend image
        run: |
          echo "Building backend image..."
          docker buildx build \
            --tag brainbytes/backend:latest \
            --cache-from type=gha,scope=backend \
            --cache-to type=gha,mode=max,scope=backend \
            --load \
            ./backend
          
      - name: Test built images
        run: |
          echo "=== Testing Frontend Image ==="
          timeout 30 docker run --rm --name test-frontend brainbytes/frontend:latest &
          FRONTEND_PID=$!
          sleep 15
          
          if docker ps | grep -q test-frontend; then
            echo "✅ Frontend image starts successfully"
            docker stop test-frontend || true
          else
            echo "❌ Frontend image failed to start"
            docker logs test-frontend 2>/dev/null || echo "No logs available"
          fi
          
          echo "=== Testing Backend Image ==="
          timeout 30 docker run --rm --name test-backend \
            -e NODE_ENV=test \
            -e MONGODB_URI=mongodb://localhost:27017/test \
            brainbytes/backend:latest &
          BACKEND_PID=$!
          sleep 15
          
          if docker ps | grep -q test-backend; then
            echo "✅ Backend image starts successfully"
            docker stop test-backend || true
          else
            echo "❌ Backend image failed to start"
            docker logs test-backend 2>/dev/null || echo "No logs available"
          fi
          
          # Cleanup any remaining containers
          docker stop test-frontend test-backend 2>/dev/null || true
          docker rm test-frontend test-backend 2>/dev/null || true
          
      - name: Show image information
        run: |
          echo "=== Built Images ==="
          docker images | grep brainbytes || echo "No brainbytes images found"
          echo ""
          if docker images | grep -q brainbytes/frontend; then
            echo "Frontend Size: $(docker images --format 'table {{.Size}}' brainbytes/frontend:latest | tail -n1)"
          fi
          if docker images | grep -q brainbytes/backend; then
            echo "Backend Size: $(docker images --format 'table {{.Size}}' brainbytes/backend:latest | tail -n1)"
          fi
          
      - name: Show build logs on failure
        if: failure()
        run: |
          echo "=== Docker System Info ==="
          docker system df
          echo ""
          echo "=== Docker Version ==="
          docker --version
          echo ""
          echo "=== Buildx Version ==="
          docker buildx version
          echo ""
          echo "=== All Images ==="
          docker images
          
      - name: Generate build summary
        if: success()
        run: |
          echo "## 🐳 BrainBytes Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Frontend Image**: Built successfully" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Backend Image**: Built successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Image Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend Tag**: brainbytes/frontend:latest" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend Tag**: brainbytes/backend:latest" >> $GITHUB_STEP_SUMMARY
          echo "- **Cache**: GitHub Actions Cache enabled" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Trigger**: ${{ github.event_name }} on ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY