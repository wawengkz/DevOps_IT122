# .github/workflows/build.yml
name: BrainBytes Build

on:
  push:
    branches: [ main, development ]
  paths-ignore:
    - '**.md'
    - 'docs/**'
  workflow_dispatch:  # Allows manual triggering

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
        
      - name: Build frontend image
        uses: docker/build-push-action@v2
        with:
          context: ./frontend
          push: false
          tags: brainbytes/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
      - name: Build backend image
        uses: docker/build-push-action@v2
        with:
          context: ./backend
          push: false
          tags: brainbytes/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
      - name: Test built images
        run: |
          echo "=== Testing Frontend Image ==="
          docker run --rm -d --name test-frontend brainbytes/frontend:latest
          sleep 10
          if docker ps | grep -q test-frontend; then
            echo "✅ Frontend image starts successfully"
            docker stop test-frontend
          else
            echo "❌ Frontend image failed to start"
            docker logs test-frontend || true
            exit 1
          fi
          
          echo "=== Testing Backend Image ==="
          docker run --rm -d --name test-backend \
            -e NODE_ENV=test \
            -e MONGODB_URI=mongodb://localhost:27017/test \
            brainbytes/backend:latest
          sleep 10
          if docker ps | grep -q test-backend; then
            echo "✅ Backend image starts successfully"
            docker stop test-backend
          else
            echo "❌ Backend image failed to start"
            docker logs test-backend || true
            exit 1
          fi
          
      - name: Show image information
        run: |
          echo "=== Built Images ==="
          docker images | grep brainbytes
          echo ""
          echo "=== Image Sizes ==="
          echo "Frontend: $(docker images --format 'table {{.Size}}' brainbytes/frontend:latest | tail -n1)"
          echo "Backend: $(docker images --format 'table {{.Size}}' brainbytes/backend:latest | tail -n1)"
          
      - name: Generate build summary
        run: |
          echo "## 🐳 BrainBytes Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Frontend Image**: Built successfully" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Backend Image**: Built successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Image Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend Tag**: brainbytes/frontend:latest" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend Tag**: brainbytes/backend:latest" >> $GITHUB_STEP_SUMMARY
          echo "- **Cache**: GitHub Actions Cache enabled" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Trigger**: ${{ github.event_name }} on ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY