# .github/workflows/quality.yml
name: BrainBytes Code Quality

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]
  workflow_dispatch:  # Allow manual triggering

jobs:
  code-quality-frontend:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'
          
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: |
          npm install
          npm install --save-dev eslint eslint-plugin-react prettier
          
      - name: Run Next.js linting on frontend
        working-directory: ./frontend
        run: npm run lint || true  # Show results but don't fail
        continue-on-error: true  # Don't fail on linting warnings
        
      - name: Check frontend code formatting with Prettier
        working-directory: ./frontend
        run: npx prettier --check "**/*.{js,jsx,ts,tsx,css,json}" --ignore-path .gitignore || true

  code-quality-backend:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'
          
      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          npm install
          npm install --save-dev eslint prettier
          
      - name: Run ESLint on backend
        working-directory: ./backend
        run: npx eslint --ext .js,.ts .
        
      - name: Check backend code formatting with Prettier
        working-directory: ./backend
        run: npx prettier --check "**/*.{js,ts,json}"

  code-quality-e2e:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'
          
      - name: Install E2E dependencies
        working-directory: ./e2e
        run: |
          npm install
          npm install --save-dev eslint prettier
          
      - name: Run ESLint on E2E tests
        working-directory: ./e2e
        run: npx eslint --ext .js tests/
        
      - name: Check E2E code formatting with Prettier
        working-directory: ./e2e
        run: npx prettier --check "tests/**/*.{js,json}"