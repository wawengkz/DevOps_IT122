# .github/workflows/quality.yml
name: BrainBytes Code Quality

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'
          
      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci
        
      - name: Run ESLint on backend
        working-directory: ./backend
        run: npx eslint . --ext .js,.mjs --max-warnings 0
        
      - name: Check backend code formatting
        working-directory: ./backend
        run: npx prettier --check "**/*.{js,mjs,json}"

  lint-frontend:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
          
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci
        
      - name: Run ESLint on frontend
        working-directory: ./frontend
        run: npx eslint . --ext .js,.jsx,.ts,.tsx --max-warnings 0
        
      - name: Check frontend code formatting
        working-directory: ./frontend
        run: npx prettier --check "**/*.{js,jsx,ts,tsx,json,css}"

  analyze-dependencies:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'
          
      - name: Audit backend dependencies
        working-directory: ./backend
        run: npm audit --audit-level=moderate
        
      - name: Audit frontend dependencies
        working-directory: ./frontend
        run: npm audit --audit-level=moderate
        
      - name: Audit E2E dependencies
        working-directory: ./e2e
        run: npm audit --audit-level=moderate

  check-docker:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Run Hadolint on backend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/Dockerfile
          
      - name: Run Hadolint on frontend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: frontend/Dockerfile
          
      - name: Validate docker-compose.yml
        run: docker-compose config