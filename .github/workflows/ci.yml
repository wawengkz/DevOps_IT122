# .github/workflows/ci.yml
name: BrainBytes CI

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    
    services:
      mongo:
        image: mongo:4.4
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongo --eval 'db.runCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          # Always delete lock file and reinstall to ensure consistency
          rm -f package-lock.json
          npm install
        
      - name: Run backend tests
        working-directory: ./backend
        run: npm test
        env:
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
          GITHUB_ACTIONS: true
          MONGODB_URI: mongodb://localhost:27017/brainbytes_test
          NODE_ENV: test

  test-frontend:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
        
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: |
          # Always delete lock file and reinstall to ensure consistency
          rm -f package-lock.json
          npm install
        
      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
        
      - name: Run frontend tests
        working-directory: ./frontend
        run: npm test

  test-e2e:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Create environment file
        run: |
          echo "HUGGINGFACE_TOKEN=${{ secrets.HUGGINGFACE_TOKEN }}" > .env
          echo "NODE_ENV=test" >> .env
          
      - name: Start services with Docker Compose
        run: |
          docker compose up -d --build
          
      - name: Show initial service status
        run: |
          echo "=== Initial Service Status ==="
          docker compose ps
          echo ""
          echo "=== Backend Logs (first 50 lines) ==="
          docker compose logs --tail=50 backend || echo "No backend logs yet"
          echo ""
          
      - name: Wait for services to be ready
        run: |
          echo "Waiting for MongoDB to be ready..."
          timeout 120 bash -c 'until docker compose exec -T mongo mongo --eval "db.runCommand({ping: 1})" 2>/dev/null; do 
            echo "Waiting for MongoDB... (attempt $((++attempt)))"
            sleep 5
          done'
          
          echo "Waiting for backend API to be ready..."
          timeout 300 bash -c 'until docker compose exec -T backend node -e "require(\"http\").get(\"http://localhost:3000/health\", (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })" 2>/dev/null || docker compose exec -T backend node -e "require(\"http\").get(\"http://localhost:3000/\", (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })" 2>/dev/null; do 
            echo "Waiting for backend... (attempt $((++attempt)))"
            docker compose logs --tail=10 backend
            sleep 10
          done'
          
          echo "Waiting for frontend to be ready..."
          timeout 180 bash -c 'until docker compose exec -T frontend node -e "require(\"http\").get(\"http://localhost:3000/\", (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })" 2>/dev/null; do 
            echo "Waiting for frontend... (attempt $((++attempt)))"
            sleep 5
          done'
          
      - name: Verify services are running
        run: |
          echo "=== Docker Compose Services Status ==="
          docker compose ps
          echo ""
          echo "=== Backend Health Check ==="
          docker compose exec -T backend node -e "require('http').get('http://localhost:3000/health', (res) => { console.log('Health check status:', res.statusCode); process.exit(res.statusCode === 200 ? 0 : 1) })" || docker compose exec -T backend node -e "require('http').get('http://localhost:3000/', (res) => { console.log('Root endpoint status:', res.statusCode); process.exit(res.statusCode === 200 ? 0 : 1) })" || echo "Backend not responding"
          echo ""
          echo "=== Frontend Health Check ==="
          docker compose exec -T frontend node -e "require('http').get('http://localhost:3000/', (res) => { console.log('Frontend status:', res.statusCode); process.exit(res.statusCode === 200 ? 0 : 1) })" || echo "Frontend not responding"
          echo ""
          echo "=== MongoDB Health Check ==="
          docker compose exec -T mongo mongo --eval "db.runCommand({ping: 1})" || echo "MongoDB not responding"
          
      - name: Install E2E test dependencies
        working-directory: ./e2e
        run: |
          rm -f package-lock.json
          npm install
        
      - name: Run E2E tests
        working-directory: ./e2e
        run: npm run test:headless
        
      - name: Show service logs on failure
        if: failure()
        run: |
          echo "=== Backend Logs ==="
          docker compose logs backend
          echo ""
          echo "=== Frontend Logs ==="
          docker compose logs frontend
          echo ""
          echo "=== MongoDB Logs ==="
          docker compose logs mongo
        
      - name: Stop services
        if: always()
        run: docker compose down -v