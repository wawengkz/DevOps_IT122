# .github/workflows/ci.yml
name: BrainBytes CI

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    
    services:
      mongo:
        image: mongo:4.4
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongo --eval 'db.runCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'
          
      # Skip dependency installation if cache hit
      - name: Cache node modules
        uses: actions/cache@v3
        id: npm-cache
        with:
          path: backend/node_modules
          key: ${{ runner.os }}-backend-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-backend-
          
      - name: Install backend dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        working-directory: ./backend
        run: |
          # Check if package-lock.json exists and is in sync
          if [ ! -f package-lock.json ]; then
            echo "No package-lock.json found, running npm install"
            npm install
          else
            echo "package-lock.json exists, checking sync..."
            # Try npm ci first, fallback to npm install if it fails
            npm ci || (echo "package-lock.json out of sync, regenerating..." && rm package-lock.json && npm install)
          fi
        
      - name: Run backend tests
        working-directory: ./backend
        run: npm test
        env:
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
          GITHUB_ACTIONS: true
          MONGODB_URI: mongodb://localhost:27017/brainbytes_test
          NODE_ENV: test

  test-frontend:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
          
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: |
          # Check if package-lock.json exists and is in sync
          if [ ! -f package-lock.json ]; then
            echo "No package-lock.json found, running npm install"
            npm install
          else
            echo "package-lock.json exists, checking sync..."
            # Try npm ci first, fallback to npm install if it fails
            npm ci || (echo "package-lock.json out of sync, regenerating..." && rm package-lock.json && npm install)
          fi
        
      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
        
      - name: Run frontend tests
        working-directory: ./frontend
        run: npm test

  test-e2e:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'e2e/package-lock.json'
          
      - name: Create environment file
        run: |
          echo "HUGGINGFACE_TOKEN=${{ secrets.HUGGINGFACE_TOKEN }}" > .env
          
      - name: Start services with Docker Compose
        run: |
          docker-compose up -d
          
      - name: Wait for services to be ready
        run: |
          echo "Waiting for backend API to be ready..."
          timeout 120 bash -c 'until curl -f http://localhost:3000/ 2>/dev/null; do 
            echo "Waiting for backend... (attempt $((++attempt)))"
            sleep 3
          done'
          
          echo "Waiting for frontend to be ready..."
          timeout 120 bash -c 'until curl -f http://localhost:8080/ 2>/dev/null; do 
            echo "Waiting for frontend... (attempt $((++attempt)))"
            sleep 3
          done'
          
      - name: Verify services are running
        run: |
          echo "=== Docker Compose Services Status ==="
          docker-compose ps
          echo ""
          echo "=== Backend Health Check ==="
          curl -v http://localhost:3000/ || echo "Backend not responding"
          echo ""
          echo "=== Frontend Health Check ==="
          curl -v http://localhost:8080/ || echo "Frontend not responding"
          echo ""
          echo "=== MongoDB Health Check ==="
          docker-compose exec -T mongo mongo --eval "db.runCommand({ping: 1})" || echo "MongoDB not responding"
          
      - name: Install E2E test dependencies
        working-directory: ./e2e
        run: |
          # Check if package-lock.json exists and is in sync
          if [ ! -f package-lock.json ]; then
            echo "No package-lock.json found, running npm install"
            npm install
          else
            echo "package-lock.json exists, checking sync..."
            # Try npm ci first, fallback to npm install if it fails
            npm ci || (echo "package-lock.json out of sync, regenerating..." && rm package-lock.json && npm install)
          fi
        
      - name: Run E2E tests
        working-directory: ./e2e
        run: npm run test:headless
        
      - name: Show service logs on failure
        if: failure()
        run: |
          echo "=== Backend Logs ==="
          docker-compose logs backend
          echo ""
          echo "=== Frontend Logs ==="
          docker-compose logs frontend
          echo ""
          echo "=== MongoDB Logs ==="
          docker-compose logs mongo
        
      - name: Stop services
        if: always()
        run: docker-compose down -v