# .github/workflows/ci.yml
name: BrainBytes CI

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    
    services:
      mongo:
        image: mongo:4.4
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongo --eval 'db.runCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          if [ ! -f package-lock.json ]; then
            npm install
          else
            npm ci
          fi

      - name: Wait for MongoDB
        run: |
          timeout 60 bash -c 'until mongo --eval "db.runCommand({ping: 1})" > /dev/null 2>&1; do sleep 2; done'

      - name: Start backend server for tests
        working-directory: ./backend
        run: |
          npm start &
          sleep 10
        env:
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/brainbytes_test

      - name: Run backend tests
        working-directory: ./backend
        run: npm test
        env:
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/brainbytes_test

  test-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: |
          if [ ! -f package-lock.json ]; then
            npm install
          else
            npm ci
          fi

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      # Skip frontend tests for now since Next.js doesn't have test script configured
      # - name: Run frontend tests
      #   working-directory: ./frontend
      #   run: npm test

  test-e2e:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Create .env file
        run: |
          echo "HUGGINGFACE_TOKEN=${{ secrets.HUGGINGFACE_TOKEN }}" > .env

      - name: Start services with Docker Compose
        run: |
          docker-compose up -d

      - name: Wait for services to be ready
        run: |
          echo "Waiting for services to start..."
          sleep 45
          
          # Wait for backend
          timeout 120 bash -c 'until curl -f http://localhost:3000/; do sleep 5; done' || {
            echo "Backend failed to start, checking logs:"
            docker-compose logs backend
            exit 1
          }
          
          # Wait for frontend
          timeout 120 bash -c 'until curl -f http://localhost:8080/; do sleep 5; done' || {
            echo "Frontend failed to start, checking logs:"
            docker-compose logs frontend
            exit 1
          }

      - name: Install E2E test dependencies
        working-directory: ./e2e
        run: |
          if [ ! -f package-lock.json ]; then
            npm install
          else
            npm ci
          fi

      - name: Run E2E tests
        working-directory: ./e2e
        run: npm run test:headless

      - name: Show service logs on failure
        if: failure()
        run: |
          echo "=== Backend Logs ==="
          docker-compose logs backend
          echo "=== Frontend Logs ==="
          docker-compose logs frontend
          echo "=== MongoDB Logs ==="
          docker-compose logs mongo

      - name: Stop services
        if: always()
        run: docker-compose down