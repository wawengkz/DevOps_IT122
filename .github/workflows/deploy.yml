# .github/workflows/deploy.yml
name: BrainBytes Railway Deploy

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - development
      deploy_frontend:
        description: 'Deploy Frontend'
        required: false
        default: true
        type: boolean
      deploy_backend:
        description: 'Deploy Backend'
        required: false
        default: true
        type: boolean
      force_deploy:
        description: 'Force redeploy even if no changes'
        required: false
        default: false
        type: boolean

jobs:
  # Job 1: Pre-deployment Checks and Setup
  pre-deployment:
    runs-on: ubuntu-latest
    outputs:
      should-deploy-backend: ${{ steps.changes.outputs.backend }}
      should-deploy-frontend: ${{ steps.changes.outputs.frontend }}
      deployment-id: ${{ steps.setup.outputs.deployment-id }}
      backend-url: ${{ steps.setup.outputs.backend-url }}
      frontend-url: ${{ steps.setup.outputs.frontend-url }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for changes
        id: changes
        run: |
          echo "🔍 Checking for code changes..."
          
          if [[ "${{ github.event.inputs.force_deploy }}" == "true" ]]; then
            echo "🔄 Force deploy enabled - deploying all services"
            echo "backend=true" >> $GITHUB_OUTPUT
            echo "frontend=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "backend=${{ github.event.inputs.deploy_backend }}" >> $GITHUB_OUTPUT
            echo "frontend=${{ github.event.inputs.deploy_frontend }}" >> $GITHUB_OUTPUT
          else
            # Check for changes in specific directories
            if git diff --name-only HEAD~1 | grep -E "^backend/" > /dev/null; then
              echo "backend=true" >> $GITHUB_OUTPUT
              echo "📦 Backend changes detected"
            else
              echo "backend=false" >> $GITHUB_OUTPUT
              echo "📦 No backend changes"
            fi
            
            if git diff --name-only HEAD~1 | grep -E "^frontend/" > /dev/null; then
              echo "frontend=true" >> $GITHUB_OUTPUT
              echo "🎨 Frontend changes detected"
            else
              echo "frontend=false" >> $GITHUB_OUTPUT
              echo "🎨 No frontend changes"
            fi
          fi

      - name: Setup deployment configuration
        id: setup
        run: |
          echo "⚙️ Setting up deployment configuration..."
          
          # Generate unique deployment ID
          DEPLOYMENT_ID="deploy-$(date +%Y%m%d-%H%M%S)-${{ github.run_number }}"
          echo "deployment-id=${DEPLOYMENT_ID}" >> $GITHUB_OUTPUT
          
          # Set environment-specific URLs (you can customize these)
          if [[ "${{ github.ref }}" == "refs/heads/main" ]] || [[ "${{ github.event.inputs.environment }}" == "production" ]]; then
            echo "backend-url=https://devops-it122-production.up.railway.app" >> $GITHUB_OUTPUT
            echo "frontend-url=https://frontend-production-46ea.up.railway.app" >> $GITHUB_OUTPUT
            echo "🏭 Production environment selected"
          else
            echo "backend-url=https://devops-it122-development.up.railway.app" >> $GITHUB_OUTPUT
            echo "frontend-url=https://frontend-development.up.railway.app" >> $GITHUB_OUTPUT
            echo "🧪 Development environment selected"
          fi

      - name: Install Railway CLI
        run: |
          echo "📦 Installing Railway CLI..."
          npm install -g @railway/cli
          railway --version

      - name: Validate Railway connection
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "🔐 Validating Railway connection..."
          
          # Verify Railway token is available
          if [[ -z "$RAILWAY_TOKEN" ]]; then
            echo "❌ RAILWAY_TOKEN environment variable is not set!"
            echo "Please ensure RAILWAY_TOKEN is added to your GitHub repository secrets."
            exit 1
          fi
          
          echo "✅ Railway token is available (${#RAILWAY_TOKEN} characters)"
          echo "🔍 Testing Railway authentication..."
          
          # Test Railway authentication with better error handling
          if railway whoami; then
            echo "✅ Railway authentication successful"
          else
            echo "❌ Railway authentication failed"
            echo "🔧 Troubleshooting steps:"
            echo "1. Verify your RAILWAY_TOKEN is a valid Project Token"
            echo "2. Check if the token has proper permissions"
            echo "3. Ensure the token is not expired"
            exit 1
          fi
          
          echo "📋 Listing available projects..."
          railway projects || echo "⚠️ Could not list projects - this might be normal for project tokens"

      - name: Generate pre-deployment summary
        run: |
          echo "## 🚀 BrainBytes Deployment Pipeline" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 Deployment Configuration" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployment ID:** \`${{ steps.setup.outputs.deployment-id }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ github.event.inputs.environment || 'auto' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🎯 Deployment Plan" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend Deploy:** ${{ steps.changes.outputs.backend }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend Deploy:** ${{ steps.changes.outputs.frontend }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🌐 Target URLs" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend:** ${{ steps.setup.outputs.backend-url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend:** ${{ steps.setup.outputs.frontend-url }}" >> $GITHUB_STEP_SUMMARY

  # Job 2: Deploy Backend to Railway
  deploy-backend:
    runs-on: ubuntu-latest
    needs: pre-deployment
    if: needs.pre-deployment.outputs.should-deploy-backend == 'true'
    environment: 
      name: railway-backend
      url: ${{ needs.pre-deployment.outputs.backend-url }}
    outputs:
      deployment-status: ${{ steps.deploy.outputs.status }}
      deployment-time: ${{ steps.deploy.outputs.time }}
      health-check: ${{ steps.health.outputs.status }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies and validate backend
        run: |
          echo "📦 Installing backend dependencies..."
          cd backend
          npm ci
          
          echo "🔍 Validating backend configuration..."
          # Check if required files exist
          if [[ ! -f "package.json" ]]; then
            echo "❌ Backend package.json not found!"
            exit 1
          fi
          
          if [[ ! -f "server.js" ]] && [[ ! -f "index.js" ]] && [[ ! -f "app.js" ]]; then
            echo "❌ Backend entry file not found (server.js, index.js, or app.js)!"
            exit 1
          fi
          
          echo "✅ Backend validation passed"

      - name: Install Railway CLI
        run: |
          npm install -g @railway/cli
          railway --version

      - name: Pre-deployment backend checks
        run: |
          echo "🔍 Running pre-deployment checks..."
          cd backend
          
          # Run linting if available
          if npm run lint --if-present; then
            echo "✅ Backend linting passed"
          else
            echo "⚠️ Linting not available or failed"
          fi
          
          # Run tests if available
          if npm test --if-present; then
            echo "✅ Backend tests passed"
          else
            echo "⚠️ Tests not available or failed"
          fi

      - name: Deploy Backend to Railway
        id: deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "🚀 Deploying Backend to Railway..."
          START_TIME=$(date +%s)
          
          # Verify Railway token
          if [[ -z "$RAILWAY_TOKEN" ]]; then
            echo "❌ RAILWAY_TOKEN is not available!"
            exit 1
          fi
          
          # Navigate to backend directory first
          cd backend
          
          echo "🔍 Current directory contents:"
          ls -la
          
          echo "📤 Initiating backend deployment..."
          
          # Try multiple deployment strategies
          DEPLOYMENT_SUCCESS=false
          
          # Strategy 1: Use specific service ID if available
          if [[ -n "${{ secrets.RAILWAY_SERVICE_ID_BACKEND }}" ]]; then
            echo "🎯 Strategy 1: Deploying to specific service ID"
            if RAILWAY_SERVICE=${{ secrets.RAILWAY_SERVICE_ID_BACKEND }} railway up --detach; then
              echo "✅ Backend deployment with service ID successful"
              DEPLOYMENT_SUCCESS=true
            else
              echo "⚠️ Service ID deployment failed, trying alternative methods"
            fi
          fi
          
          # Strategy 2: Try direct deployment if service ID failed or not available
          if [[ "$DEPLOYMENT_SUCCESS" != "true" ]]; then
            echo "🎯 Strategy 2: Direct deployment"
            if railway up --detach; then
              echo "✅ Backend direct deployment successful"
              DEPLOYMENT_SUCCESS=true
            else
              echo "⚠️ Direct deployment failed"
            fi
          fi
          
          # Strategy 3: Try without detach flag
          if [[ "$DEPLOYMENT_SUCCESS" != "true" ]]; then
            echo "🎯 Strategy 3: Deployment without detach"
            if railway up; then
              echo "✅ Backend deployment without detach successful"
              DEPLOYMENT_SUCCESS=true
            else
              echo "❌ All deployment strategies failed"
            fi
          fi
          
          if [[ "$DEPLOYMENT_SUCCESS" == "true" ]]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "✅ Backend deployment initiated successfully"
          else
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "❌ Backend deployment failed"
            
            # Try to get more information about the failure
            echo "🔍 Debugging information:"
            railway status || echo "Could not get status"
            railway services || echo "Could not list services"
            exit 1
          fi
          
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "time=${DURATION}s" >> $GITHUB_OUTPUT

      - name: Wait for backend deployment
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "⏳ Waiting for backend deployment to stabilize..."
          sleep 90  # Give Railway time to deploy and start the service
          
          echo "🔄 Checking deployment status..."
          if [[ -n "${{ secrets.RAILWAY_SERVICE_ID_BACKEND }}" ]]; then
            railway status --service ${{ secrets.RAILWAY_SERVICE_ID_BACKEND }} || echo "Could not get service status"
          else
            railway status || echo "Could not get general status"
          fi

      - name: Backend health check
        id: health
        run: |
          echo "🏥 Performing backend health check..."
          BACKEND_URL="${{ needs.pre-deployment.outputs.backend-url }}"
          
          # Extended health check with retries
          MAX_RETRIES=12
          RETRY_COUNT=0
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            echo "🔍 Health check attempt $((RETRY_COUNT + 1))/$MAX_RETRIES..."
            
            # Try multiple endpoints
            for endpoint in "/health" "/" "/api" ""; do
              if curl -f -s --max-time 10 "${BACKEND_URL}${endpoint}" > /dev/null 2>&1; then
                echo "✅ Backend health check passed on endpoint: ${endpoint}"
                echo "status=healthy" >> $GITHUB_OUTPUT
                exit 0
              fi
            done
            
            echo "⚠️ Health check failed, retrying in 15 seconds..."
            sleep 15
            RETRY_COUNT=$((RETRY_COUNT + 1))
          done
          
          echo "❌ Backend health check failed after $MAX_RETRIES attempts"
          echo "status=unhealthy" >> $GITHUB_OUTPUT
          
          # Try to get more info about the deployment
          echo "🔍 Attempting to get deployment logs..."
          if [[ -n "${{ secrets.RAILWAY_SERVICE_ID_BACKEND }}" ]]; then
            railway logs --service ${{ secrets.RAILWAY_SERVICE_ID_BACKEND }} --lines 50 || echo "Could not get service logs"
          else
            railway logs --lines 50 || echo "Could not get logs"
          fi

      - name: Test backend API endpoints
        run: |
          echo "🧪 Testing backend API endpoints..."
          BACKEND_URL="${{ needs.pre-deployment.outputs.backend-url }}"
          
          # Test multiple endpoints
          for endpoint in "/" "/health" "/api" "/api/messages" "/api/users"; do
            echo "📍 Testing endpoint: ${endpoint}"
            if curl -f -s --max-time 10 "${BACKEND_URL}${endpoint}" > /dev/null 2>&1; then
              echo "✅ ${endpoint} endpoint accessible"
            else
              echo "⚠️ ${endpoint} endpoint test failed"
            fi
          done

      - name: Generate backend deployment report
        if: always()
        run: |
          echo "## 🔧 Backend Deployment Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Deployment Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Service ID:** \`${{ secrets.RAILWAY_SERVICE_ID_BACKEND || 'auto-detected' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployment Status:** ${{ steps.deploy.outputs.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployment Time:** ${{ steps.deploy.outputs.time }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Health Check:** ${{ steps.health.outputs.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** ${{ needs.pre-deployment.outputs.backend-url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🎯 API Endpoints" >> $GITHUB_STEP_SUMMARY
          echo "- \`GET /health\` - Health check" >> $GITHUB_STEP_SUMMARY
          echo "- \`GET /api/messages\` - Chat messages" >> $GITHUB_STEP_SUMMARY
          echo "- \`GET /api/users\` - User management" >> $GITHUB_STEP_SUMMARY
          echo "- \`GET /api/materials\` - Learning materials" >> $GITHUB_STEP_SUMMARY

  # Job 3: Deploy Frontend to Railway
  deploy-frontend:
    runs-on: ubuntu-latest
    needs: [pre-deployment, deploy-backend]
    if: always() && needs.pre-deployment.outputs.should-deploy-frontend == 'true'
    environment: 
      name: railway-frontend
      url: ${{ needs.pre-deployment.outputs.frontend-url }}
    outputs:
      deployment-status: ${{ steps.deploy.outputs.status }}
      deployment-time: ${{ steps.deploy.outputs.time }}
      accessibility-check: ${{ steps.accessibility.outputs.status }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies and validate frontend
        run: |
          echo "📦 Installing frontend dependencies..."
          cd frontend
          npm ci
          
          echo "🔍 Validating frontend configuration..."
          # Check if required files exist
          if [[ ! -f "package.json" ]]; then
            echo "❌ Frontend package.json not found!"
            exit 1
          fi
          
          echo "✅ Frontend validation passed"

      - name: Setup environment variables for frontend
        run: |
          echo "⚙️ Setting up frontend environment variables..."
          cd frontend
          
          # Create .env.local for build (if needed)
          cat > .env.local << EOF
          NEXT_PUBLIC_API_URL=${{ needs.pre-deployment.outputs.backend-url }}
          NEXT_TELEMETRY_DISABLED=1
          EOF
          
          echo "✅ Environment variables configured"

      - name: Install Railway CLI
        run: |
          npm install -g @railway/cli
          railway --version

      - name: Pre-deployment frontend checks
        run: |
          echo "🔍 Running pre-deployment checks..."
          cd frontend
          
          # Run linting if available
          if npm run lint --if-present; then
            echo "✅ Frontend linting passed"
          else
            echo "⚠️ Linting not available or failed"
          fi
          
          # Skip build test to avoid issues, let Railway handle it
          echo "⚠️ Skipping local build test - letting Railway handle the build"

      - name: Deploy Frontend to Railway
        id: deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "🚀 Deploying Frontend to Railway..."
          START_TIME=$(date +%s)
          
          # Verify Railway token
          if [[ -z "$RAILWAY_TOKEN" ]]; then
            echo "❌ RAILWAY_TOKEN is not available!"
            exit 1
          fi
          
          # Navigate to frontend directory first
          cd frontend
          
          echo "🔍 Current directory contents:"
          ls -la
          
          echo "📤 Initiating frontend deployment..."
          
          # Try multiple deployment strategies
          DEPLOYMENT_SUCCESS=false
          
          # Strategy 1: Use specific service ID if available
          if [[ -n "${{ secrets.RAILWAY_SERVICE_ID_FRONTEND }}" ]]; then
            echo "🎯 Strategy 1: Deploying to specific service ID"
            if RAILWAY_SERVICE=${{ secrets.RAILWAY_SERVICE_ID_FRONTEND }} railway up --detach; then
              echo "✅ Frontend deployment with service ID successful"
              DEPLOYMENT_SUCCESS=true
            else
              echo "⚠️ Service ID deployment failed, trying alternative methods"
            fi
          fi
          
          # Strategy 2: Try direct deployment if service ID failed or not available
          if [[ "$DEPLOYMENT_SUCCESS" != "true" ]]; then
            echo "🎯 Strategy 2: Direct deployment"
            if railway up --detach; then
              echo "✅ Frontend direct deployment successful"
              DEPLOYMENT_SUCCESS=true
            else
              echo "⚠️ Direct deployment failed"
            fi
          fi
          
          # Strategy 3: Try without detach flag
          if [[ "$DEPLOYMENT_SUCCESS" != "true" ]]; then
            echo "🎯 Strategy 3: Deployment without detach"
            if railway up; then
              echo "✅ Frontend deployment without detach successful"
              DEPLOYMENT_SUCCESS=true
            else
              echo "❌ All deployment strategies failed"
            fi
          fi
          
          if [[ "$DEPLOYMENT_SUCCESS" == "true" ]]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "✅ Frontend deployment initiated successfully"
          else
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "❌ Frontend deployment failed"
            
            # Try to get more information about the failure
            echo "🔍 Debugging information:"
            railway status || echo "Could not get status"
            railway services || echo "Could not list services"
            exit 1
          fi
          
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "time=${DURATION}s" >> $GITHUB_OUTPUT

      - name: Wait for frontend deployment
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "⏳ Waiting for frontend deployment to complete..."
          sleep 150  # Frontend builds take longer than backend
          
          echo "🔄 Checking deployment status..."
          if [[ -n "${{ secrets.RAILWAY_SERVICE_ID_FRONTEND }}" ]]; then
            railway status --service ${{ secrets.RAILWAY_SERVICE_ID_FRONTEND }} || echo "Could not get service status"
          else
            railway status || echo "Could not get general status"
          fi

      - name: Frontend accessibility check
        id: accessibility
        run: |
          echo "🌐 Performing frontend accessibility check..."
          FRONTEND_URL="${{ needs.pre-deployment.outputs.frontend-url }}"
          
          # Extended accessibility check with retries
          MAX_RETRIES=20
          RETRY_COUNT=0
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            echo "🔍 Accessibility check attempt $((RETRY_COUNT + 1))/$MAX_RETRIES..."
            
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$FRONTEND_URL" 2>/dev/null || echo "000")
            
            if [[ "$HTTP_CODE" =~ ^[23] ]]; then
              echo "✅ Frontend is accessible (HTTP $HTTP_CODE)"
              echo "status=accessible" >> $GITHUB_OUTPUT
              break
            else
              echo "⚠️ Frontend returned HTTP $HTTP_CODE, retrying in 20 seconds..."
              sleep 20
              RETRY_COUNT=$((RETRY_COUNT + 1))
            fi
          done
          
          if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
            echo "❌ Frontend accessibility check failed after $MAX_RETRIES attempts"
            echo "status=inaccessible" >> $GITHUB_OUTPUT
            
            # Try to get more info about the deployment
            echo "🔍 Attempting to get deployment logs..."
            if [[ -n "${{ secrets.RAILWAY_SERVICE_ID_FRONTEND }}" ]]; then
              railway logs --service ${{ secrets.RAILWAY_SERVICE_ID_FRONTEND }} --lines 50 || echo "Could not get service logs"
            else
              railway logs --lines 50 || echo "Could not get logs"
            fi
          fi

      - name: Test frontend functionality
        run: |
          echo "🧪 Testing frontend functionality..."
          FRONTEND_URL="${{ needs.pre-deployment.outputs.frontend-url }}"
          
          # Test if the page loads and contains expected content
          echo "📄 Checking page content..."
          PAGE_CONTENT=$(curl -s "$FRONTEND_URL" 2>/dev/null || echo "")
          
          if echo "$PAGE_CONTENT" | grep -i "brainbytes\|brain bytes\|html\|<!DOCTYPE" > /dev/null; then
            echo "✅ Frontend contains expected content"
          else
            echo "⚠️ Frontend content verification failed"
          fi

      - name: Generate frontend deployment report
        if: always()
        run: |
          echo "## 🎨 Frontend Deployment Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Deployment Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Service ID:** \`${{ secrets.RAILWAY_SERVICE_ID_FRONTEND || 'auto-detected' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployment Status:** ${{ steps.deploy.outputs.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployment Time:** ${{ steps.deploy.outputs.time }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Accessibility:** ${{ steps.accessibility.outputs.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** ${{ needs.pre-deployment.outputs.frontend-url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🎯 Frontend Features" >> $GITHUB_STEP_SUMMARY
          echo "- Next.js React application" >> $GITHUB_STEP_SUMMARY
          echo "- AI chat interface" >> $GITHUB_STEP_SUMMARY
          echo "- Real-time communication with backend" >> $GITHUB_STEP_SUMMARY
          echo "- Responsive design for all devices" >> $GITHUB_STEP_SUMMARY

  # Job 4: Integration Testing
  integration-testing:
    runs-on: ubuntu-latest
    needs: [pre-deployment, deploy-backend, deploy-frontend]
    if: always() && (needs.deploy-backend.result == 'success' || needs.deploy-frontend.result == 'success')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js for testing
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install testing dependencies
        run: |
          echo "📦 Installing testing dependencies..."
          npm install -g axios

      - name: End-to-end connectivity test
        run: |
          echo "🔗 Testing end-to-end connectivity..."
          BACKEND_URL="${{ needs.pre-deployment.outputs.backend-url }}"
          FRONTEND_URL="${{ needs.pre-deployment.outputs.frontend-url }}"
          
          # Create a simple integration test
          cat > integration-test.js << 'EOF'
          const axios = require('axios');
          
          async function runIntegrationTests() {
            console.log('🧪 Running BrainBytes Integration Tests...');
            
            const backendUrl = process.argv[2];
            const frontendUrl = process.argv[3];
            
            let testResults = {
              backend: { healthy: false, accessible: false },
              frontend: { accessible: false, loadTime: 0 }
            };
            
            // Test Backend
            console.log('🔧 Testing Backend...');
            try {
              // Try multiple endpoints
              const endpoints = ['/health', '/', '/api'];
              for (const endpoint of endpoints) {
                try {
                  const response = await axios.get(`${backendUrl}${endpoint}`, { timeout: 10000 });
                  if (response.status === 200) {
                    testResults.backend.accessible = true;
                    if (endpoint === '/health') testResults.backend.healthy = true;
                    console.log(`✅ Backend ${endpoint} accessible`);
                    break;
                  }
                } catch (err) {
                  console.log(`⚠️ Backend ${endpoint} failed: ${err.message}`);
                }
              }
            } catch (error) {
              console.log('❌ All backend tests failed:', error.message);
            }
            
            // Test Frontend
            console.log('🎨 Testing Frontend...');
            try {
              const startTime = Date.now();
              const frontendResponse = await axios.get(frontendUrl, { timeout: 15000 });
              const loadTime = Date.now() - startTime;
              
              testResults.frontend.accessible = frontendResponse.status === 200;
              testResults.frontend.loadTime = loadTime;
              console.log(`✅ Frontend accessible (${loadTime}ms load time)`);
            } catch (error) {
              console.log('❌ Frontend tests failed:', error.message);
            }
            
            // Summary
            console.log('📊 Test Results Summary:');
            console.log(`Backend Health: ${testResults.backend.healthy ? '✅' : '❌'}`);
            console.log(`Backend Accessible: ${testResults.backend.accessible ? '✅' : '❌'}`);
            console.log(`Frontend Access: ${testResults.frontend.accessible ? '✅' : '❌'}`);
            console.log(`Frontend Load Time: ${testResults.frontend.loadTime}ms`);
            
            // Determine overall success (at least one service should work)
            const success = testResults.backend.accessible || testResults.frontend.accessible;
            console.log(`Overall Status: ${success ? '✅ PASS' : '❌ FAIL'}`);
            
            return success;
          }
          
          runIntegrationTests().then(success => {
            process.exit(success ? 0 : 1);
          }).catch(error => {
            console.error('❌ Integration test failed:', error);
            process.exit(1);
          });
          EOF
          
          # Run the integration test
          if node integration-test.js "${{ needs.pre-deployment.outputs.backend-url }}" "${{ needs.pre-deployment.outputs.frontend-url }}"; then
            echo "✅ Integration tests passed"
          else
            echo "⚠️ Some integration tests failed"
          fi

      - name: Generate integration test report
        run: |
          echo "## 🔗 Integration Test Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🧪 Test Results" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend Health:** ${{ needs.deploy-backend.outputs.health-check }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend Access:** ${{ needs.deploy-frontend.outputs.accessibility-check }}" >> $GITHUB_STEP_SUMMARY
          echo "- **End-to-End:** Tested connectivity between services" >> $GITHUB_STEP_SUMMARY

  # Job 5: Deployment Summary
  deployment-summary:
    runs-on: ubuntu-latest
    needs: [pre-deployment, deploy-backend, deploy-frontend, integration-testing]
    if: always()
    
    steps:
      - name: Calculate deployment metrics
        id: metrics
        run: |
          echo "📊 Calculating deployment metrics..."
          
          # Determine overall success
          BACKEND_SUCCESS="${{ needs.deploy-backend.result == 'success' }}"
          FRONTEND_SUCCESS="${{ needs.deploy-frontend.result == 'success' }}"
          
          if [[ "$BACKEND_SUCCESS" == "true" && "$FRONTEND_SUCCESS" == "true" ]]; then
            echo "overall-status=success" >> $GITHUB_OUTPUT
            echo "status-emoji=✅" >> $GITHUB_OUTPUT
          elif [[ "$BACKEND_SUCCESS" == "true" || "$FRONTEND_SUCCESS" == "true" ]]; then
            echo "overall-status=partial" >> $GITHUB_OUTPUT
            echo "status-emoji=⚠️" >> $GITHUB_OUTPUT
          else
            echo "overall-status=failed" >> $GITHUB_OUTPUT
            echo "status-emoji=❌" >> $GITHUB_OUTPUT
          fi
          
          # Calculate total deployment time (approximate)
          TOTAL_TIME="estimated 10-15 minutes"
          echo "total-time=${TOTAL_TIME}" >> $GITHUB_OUTPUT

      - name: Generate comprehensive deployment summary
        run: |
          echo "# ${{ steps.metrics.outputs.status-emoji }} BrainBytes Railway Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📋 Deployment Overview" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Deployment ID** | \`${{ needs.pre-deployment.outputs.deployment-id }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Overall Status** | ${{ steps.metrics.outputs.overall-status }} ${{ steps.metrics.outputs.status-emoji }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Trigger** | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Total Time** | ${{ steps.metrics.outputs.total-time }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | ${{ github.event.inputs.environment || 'auto-detected' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "## 🎯 Service Deployment Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Status | Health | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|--------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| **🔧 Backend API** | ${{ needs.deploy-backend.result }} | ${{ needs.deploy-backend.outputs.health-check || 'not-checked' }} | [${{ needs.pre-deployment.outputs.backend-url }}](${{ needs.pre-deployment.outputs.backend-url }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| **🎨 Frontend** | ${{ needs.deploy-frontend.result }} | ${{ needs.deploy-frontend.outputs.accessibility-check || 'not-checked' }} | [${{ needs.pre-deployment.outputs.frontend-url }}](${{ needs.pre-deployment.outputs.frontend-url }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| **🔗 Integration** | ${{ needs.integration-testing.result }} | tested | End-to-end connectivity |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "## 🚀 BrainBytes Features Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🤖 AI-Powered Learning" >> $GITHUB_STEP_SUMMARY
          echo "- **Intelligent Tutoring:** Context-aware AI responses" >> $GITHUB_STEP_SUMMARY
          echo "- **Subject Categorization:** Math, Science, History, and more" >> $GITHUB_STEP_SUMMARY
          echo "- **Follow-up Questions:** Guided learning paths" >> $GITHUB_STEP_SUMMARY
          echo "- **Sentiment Analysis:** Emotional learning support" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 💾 Data Management" >> $GITHUB_STEP_SUMMARY
          echo "- **User Profiles:** Personalized learning preferences" >> $GITHUB_STEP_SUMMARY
          echo "- **Chat History:** Persistent conversation storage" >> $GITHUB_STEP_SUMMARY
          echo "- **Learning Materials:** Structured educational content" >> $GITHUB_STEP_SUMMARY
          echo "- **Progress Tracking:** Learning analytics and insights" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🌐 User Experience" >> $GITHUB_STEP_SUMMARY
          echo "- **Real-time Chat:** Instant AI responses" >> $GITHUB_STEP_SUMMARY
          echo "- **Responsive Design:** Works on all devices" >> $GITHUB_STEP_SUMMARY
          echo "- **Modern UI:** Clean, intuitive interface" >> $GITHUB_STEP_SUMMARY
          echo "- **Fast Performance:** Optimized for speed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "## 🔧 API Endpoints Available" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Core Endpoints" >> $GITHUB_STEP_SUMMARY
          echo "- \`GET /health\` - Service health check" >> $GITHUB_STEP_SUMMARY
          echo "- \`GET /\` - API welcome message" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Chat & AI" >> $GITHUB_STEP_SUMMARY
          echo "- \`GET /api/messages\` - Retrieve chat history" >> $GITHUB_STEP_SUMMARY
          echo "- \`POST /api/messages\` - Send message and get AI response" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### User Management" >> $GITHUB_STEP_SUMMARY
          echo "- \`GET /api/users\` - List all users" >> $GITHUB_STEP_SUMMARY
          echo "- \`POST /api/users\` - Create new user" >> $GITHUB_STEP_SUMMARY
          echo "- \`GET /api/users/:id\` - Get user by ID" >> $GITHUB_STEP_SUMMARY
          echo "- \`PUT /api/users/:id\` - Update user" >> $GITHUB_STEP_SUMMARY
          echo "- \`DELETE /api/users/:id\` - Delete user" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Learning Materials" >> $GITHUB_STEP_SUMMARY
          echo "- \`GET /api/materials\` - List learning materials" >> $GITHUB_STEP_SUMMARY
          echo "- \`POST /api/materials\` - Create new material" >> $GITHUB_STEP_SUMMARY
          echo "- \`GET /api/materials/:id\` - Get material by ID" >> $GITHUB_STEP_SUMMARY
          echo "- \`PUT /api/materials/:id\` - Update material" >> $GITHUB_STEP_SUMMARY
          echo "- \`DELETE /api/materials/:id\` - Delete material" >> $GITHUB_STEP_SUMMARY

      - name: Final deployment status notification
        run: |
          echo "🏁 BrainBytes Railway Deployment Pipeline Complete!"
          echo ""
          echo "📊 Final Status Summary:"
          echo "========================="
          echo "🔧 Backend Deploy:     ${{ needs.deploy-backend.result }}"
          echo "🎨 Frontend Deploy:    ${{ needs.deploy-frontend.result }}"
          echo "🔗 Integration Tests:  ${{ needs.integration-testing.result }}"
          echo "📊 Overall Status:     ${{ steps.metrics.outputs.overall-status }}"
          echo ""
          
          if [[ "${{ steps.metrics.outputs.overall-status }}" == "success" ]]; then
            echo "🎉 SUCCESS! BrainBytes AI Tutor is LIVE! 🎉"
            echo ""
            echo "🌐 Application URLs:"
            echo "   📱 Frontend: ${{ needs.pre-deployment.outputs.frontend-url }}"
            echo "   🔧 Backend:  ${{ needs.pre-deployment.outputs.backend-url }}"
            echo ""
            echo "🚀 Your AI-powered educational platform is ready to help students learn!"
            echo "🎯 Features include intelligent tutoring, personalized learning, and real-time chat."
            echo ""
            echo "✨ Share your BrainBytes application with the world! ✨"
            exit 0
          elif [[ "${{ steps.metrics.outputs.overall-status }}" == "partial" ]]; then
            echo "⚠️ PARTIAL SUCCESS - Some services deployed"
            echo "Check individual service status and redeploy if needed."
            exit 0
          else
            echo "❌ DEPLOYMENT FAILED"
            echo "Please check the logs above and retry the deployment."
            echo ""
            echo "💡 Common solutions:"
            echo "   - Check Railway token permissions"
            echo "   - Verify service IDs are correct"
            echo "   - Review code for build errors"
            echo "   - Check Railway service limits"
            echo "   - Ensure your Railway project exists and is accessible"
            exit 1
          fi

      - name: Cleanup
        if: always()
        run: |
          echo "🧹 Performing final cleanup..."
          echo "✅ Deployment pipeline cleanup complete"