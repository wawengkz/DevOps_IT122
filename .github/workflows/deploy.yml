# .github/workflows/deploy.yml
name: BrainBytes Railway Deploy

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - development
      deploy_frontend:
        description: 'Deploy Frontend'
        required: false
        default: true
        type: boolean
      deploy_backend:
        description: 'Deploy Backend'
        required: false
        default: true
        type: boolean

jobs:
  # Job 1: Deploy Backend to Railway
  deploy-backend:
    runs-on: ubuntu-latest
    if: github.event.inputs.deploy_backend != 'false'
    environment: 
      name: railway-backend
      url: ${{ steps.deploy.outputs.url }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: |
          npm install -g @railway/cli

      - name: Deploy Backend to Railway
        id: deploy
        run: |
          echo "🚀 Deploying Backend to Railway..."
          
          # Login to Railway using token
          railway login --token ${{ secrets.RAILWAY_TOKEN }}
          
          # Set the project and environment
          export RAILWAY_PROJECT_ID=${{ secrets.RAILWAY_PROJECT_ID }}
          export RAILWAY_ENVIRONMENT_ID=${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          
          # Deploy backend service
          railway up --service ${{ secrets.RAILWAY_SERVICE_ID_BACKEND }} --detach
          
          echo "✅ Backend deployment initiated"
          echo "url=https://your-backend-url.railway.app" >> $GITHUB_OUTPUT

      - name: Wait for backend deployment
        run: |
          echo "⏳ Waiting for backend deployment to complete..."
          sleep 60  # Give Railway time to deploy
          
          # You can add health check here if you have a health endpoint
          echo "Backend deployment completed"

  # Job 2: Deploy Frontend to Railway
  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-backend
    if: github.event.inputs.deploy_frontend != 'false'
    environment: 
      name: railway-frontend
      url: ${{ steps.deploy.outputs.url }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: |
          npm install -g @railway/cli

      - name: Deploy Frontend to Railway
        id: deploy
        run: |
          echo "🚀 Deploying Frontend to Railway..."
          
          # Login to Railway using token
          railway login --token ${{ secrets.RAILWAY_TOKEN }}
          
          # Set the project and environment
          export RAILWAY_PROJECT_ID=${{ secrets.RAILWAY_PROJECT_ID }}
          export RAILWAY_ENVIRONMENT_ID=${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          
          # Deploy frontend service
          railway up --service ${{ secrets.RAILWAY_SERVICE_ID_FRONTEND }} --detach
          
          echo "✅ Frontend deployment initiated"
          echo "url=https://frontend-production-46ea.up.railway.app" >> $GITHUB_OUTPUT

      - name: Wait for frontend deployment
        run: |
          echo "⏳ Waiting for frontend deployment to complete..."
          sleep 60  # Give Railway time to deploy
          
          echo "Frontend deployment completed"

  # Job 3: Verify Deployment
  verify-deployment:
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    if: always()
    
    steps:
      - name: Verify Backend Health
        run: |
          echo "🔍 Verifying backend deployment..."
          
          # Wait a bit more for services to stabilize
          sleep 30
          
          # Try to ping backend health endpoint
          # Replace with your actual backend URL
          if curl -f https://your-backend-url.railway.app/health; then
            echo "✅ Backend is healthy"
          else
            echo "⚠️ Backend health check failed - this is normal during deployment"
          fi

      - name: Verify Frontend Access
        run: |
          echo "🔍 Verifying frontend deployment..."
          
          # Try to access frontend
          # Replace with your actual frontend URL
          if curl -s https://frontend-production-46ea.up.railway.app > /dev/null; then
            echo "✅ Frontend is accessible"
          else
            echo "⚠️ Frontend access check failed - this is normal during deployment"
          fi

      - name: Generate deployment summary
        run: |
          echo "## 🚀 Railway Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployment Status" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend:** ${{ needs.deploy-backend.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend:** ${{ needs.deploy-frontend.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Service URLs" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend:** https://frontend-production-46ea.up.railway.app" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend API:** https://your-backend-url.railway.app" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Features Deployed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ AI-powered tutoring system" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ MongoDB database integration" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Hugging Face AI integration" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Full-stack Next.js + Node.js application" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.deploy-backend.result }}" == "success" && "${{ needs.deploy-frontend.result }}" == "success" ]]; then
            echo "## ✅ Deployment Successful!" >> $GITHUB_STEP_SUMMARY
            echo "🎉 Your BrainBytes application is now live on Railway!" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ⚠️ Deployment Issues Detected" >> $GITHUB_STEP_SUMMARY
            echo "Some services may have failed to deploy. Check the logs above." >> $GITHUB_STEP_SUMMARY
          fi

  # Job 4: Notify Deployment Status
  notify-status:
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend, verify-deployment]
    if: always()
    
    steps:
      - name: Final deployment status
        run: |
          echo "🏁 BrainBytes Railway Deployment Complete!"
          echo ""
          echo "📊 Final Results:"
          echo "- 🔧 Backend Deploy: ${{ needs.deploy-backend.result }}"
          echo "- 🎨 Frontend Deploy: ${{ needs.deploy-frontend.result }}"
          echo "- 🔍 Verification: ${{ needs.verify-deployment.result }}"
          echo ""
          
          if [[ "${{ needs.deploy-backend.result }}" == "success" && "${{ needs.deploy-frontend.result }}" == "success" ]]; then
            echo "🎉 RAILWAY DEPLOYMENT SUCCESS!"
            echo ""
            echo "🌐 Your BrainBytes AI Tutor is now live:"
            echo "   📍 Frontend: https://frontend-production-46ea.up.railway.app"
            echo "   📍 Backend: https://your-backend-url.railway.app"
            echo ""
            echo "🚀 Ready to help students learn with AI!"
            exit 0
          else
            echo "❌ RAILWAY DEPLOYMENT FAILED!"
            echo "Please check the failed jobs and retry."
            exit 1
          fi