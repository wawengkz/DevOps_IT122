# .github/workflows/deploy.yml
name: BrainBytes Railway Deploy

on:
  push:
    branches: [main, development]
  workflow_dispatch:

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Railway CLI
        run: |
          echo "📦 Installing Railway CLI..."
          npm install -g @railway/cli
          railway --version

      - name: Validate Railway Token
        run: |
          echo "🔐 Validating Railway connection..."
          
          if [[ -z "$RAILWAY_TOKEN" ]]; then
            echo "❌ RAILWAY_TOKEN is not set!"
            echo "Please add RAILWAY_TOKEN to your GitHub repository secrets."
            exit 1
          fi
          
          echo "✅ Railway token is available"
          echo "🔍 Testing Railway authentication..."
          railway whoami
          
          echo "📋 Listing available projects..."
          railway projects || echo "⚠️ Could not list projects"

      - name: Deploy Backend
        run: |
          echo "🚀 Deploying Backend..."
          cd backend
          
          echo "📦 Installing backend dependencies..."
          npm ci
          
          echo "🔍 Project structure:"
          ls -la
          
          echo "📤 Deploying to Railway..."
          railway up --detach || railway up

      - name: Deploy Frontend  
        run: |
          echo "🚀 Deploying Frontend..."
          cd frontend
          
          echo "📦 Installing frontend dependencies..."
          npm ci
          
          echo "🔍 Project structure:"
          ls -la
          
          echo "📤 Deploying to Railway..."
          railway up --detach || railway up

      - name: Get Deployment Status
        run: |
          echo "📊 Getting deployment status..."
          railway status || echo "⚠️ Could not get status"
          
          echo "🔍 Listing services..."
          railway services || echo "⚠️ Could not list services"

      - name: Summary
        run: |
          echo "## 🚀 BrainBytes Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 Deployment Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Deployment Steps Completed" >> $GITHUB_STEP_SUMMARY
          echo "- Backend deployment initiated" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend deployment initiated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🎉 Check your Railway dashboard for deployment status!"