services:
  frontend:
    build: ./frontend
    ports:
      - "8080:3000"
    volumes:
      - ./frontend:/usr/src/app
      - frontend_node_modules:/usr/src/app/node_modules
    depends_on:
      - backend  # Simple dependency without health check
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/usr/src/app
      - backend_node_modules:/usr/src/app/node_modules
    environment:
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN}
      - NODE_ENV=${NODE_ENV:-development}
      - MONGODB_URI=mongodb://mongo:27017/brainbytes
    depends_on:
      - mongo  # Simple dependency without health check
    restart: unless-stopped

  mongo:
    image: mongo:4.4
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=brainbytes
    restart: unless-stopped

volumes:
  mongo-data:
  backend_node_modules:
  frontend_node_modules: