global:
  smtp_smarthost: 'localhost:587'
  smtp_from: 'alerts@brainbytes.local'

route:
  group_by: ['alertname']
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'brainbytes-webhook'

receivers:
- name: 'brainbytes-webhook'
  webhook_configs:
  - url: 'http://host.docker.internal:5001/alert'
    send_resolved: true
    http_config:
      follow_redirects: true

