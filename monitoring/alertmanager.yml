global:
  smtp_smarthost: 'localhost:587'
  smtp_from: 'alerts@brainbytes.local'
  resolve_timeout: 5m

# Enhanced routing with different handling for different severities
route:
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 4h
  receiver: 'default-receiver'
  
  routes:
  # Critical alerts - immediate notification
  - match:
      severity: critical
    receiver: 'critical-alerts'
    group_wait: 5s
    group_interval: 10s
    repeat_interval: 30m
    continue: true
    
  # Business hours alerts - faster response during school time
  - match:
      context: philippine_school_hours
    receiver: 'school-hours-alerts'
    group_wait: 5s
    repeat_interval: 15m
    continue: true
    
  # User experience alerts
  - match:
      tier: user_experience
    receiver: 'user-experience-alerts'
    group_wait: 15s
    repeat_interval: 2h
    
  # Infrastructure alerts
  - match:
      tier: infrastructure
    receiver: 'infrastructure-alerts'
    group_wait: 10s
    repeat_interval: 1h

receivers:
# Critical alerts receiver (REMOVED invalid 'title' field)
- name: 'critical-alerts'
  webhook_configs:
  - url: 'http://alert-receiver:5001/webhook'
    send_resolved: true
    http_config:
      follow_redirects: true
    max_alerts: 5

# School hours receiver (REMOVED invalid 'title' field)
- name: 'school-hours-alerts'
  webhook_configs:
  - url: 'http://alert-receiver:5001/webhook'
    send_resolved: true
    http_config:
      follow_redirects: true

# User experience receiver (REMOVED invalid 'title' field)
- name: 'user-experience-alerts'
  webhook_configs:
  - url: 'http://alert-receiver:5001/webhook'
    send_resolved: true
    http_config:
      follow_redirects: true

# Infrastructure receiver (REMOVED invalid 'title' field)
- name: 'infrastructure-alerts'
  webhook_configs:
  - url: 'http://alert-receiver:5001/webhook'
    send_resolved: true
    http_config:
      follow_redirects: true

# Default receiver (REMOVED invalid 'title' field)
- name: 'default-receiver'
  webhook_configs:
  - url: 'http://alert-receiver:5001/webhook'
    send_resolved: true
    http_config:
      follow_redirects: true

# Your original working receiver (keeping as backup)
- name: 'brainbytes-webhook'
  webhook_configs:
  - url: 'http://host.docker.internal:5001/webhook'
    send_resolved: true
    http_config:
      follow_redirects: true

inhibit_rules:
# Inhibit warning alerts when critical alerts are firing
- source_match:
    severity: 'critical'
  target_match:
    severity: 'warning'
  equal: ['alertname', 'instance']